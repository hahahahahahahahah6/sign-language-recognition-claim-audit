[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-language-recognition-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
sign-language-recognition-claim-audit = "sign_language_recognition_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["sign_language_recognition_claim_audit*"]
